[book]
title = "kmod loader 文档"
description = "KARDS 的 Lua / C++ 模组加载器：Android 版文档"
authors = ["kmod contributors"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/kmod-docs/"
git-repository-url = "https://github.com/kardswalker/kmod-docs"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/kardswalker/kmod-docs/edit/main/{path}"
additional-css = ["theme/kmod.css"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 3
boost-hierarchy = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = false
